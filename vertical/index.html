<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>SPOT LIGHT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;}
canvas{display:block;position:fixed;top:0;left:0;}
</style>
</head>
<canvas id="cv"></canvas>
<script>
const SRC_BLACK='../black_poster.png';
const SRC_TYPO='../L01.png';   // SPOT LIGHT 녹아웃이 들어있는 본문
const LINE_H=18,TYPE_DUR=3000;

const DOT_SPACING=2,SCATTER_STR=5.5,DAMPING=.90,SPRING=.085,NOISE=.45;
const PARTICLE_DENSITY=.667;
let INFLUENCE_R=113;

// 녹화용: ?record 로 열면 시작 20초 뒤 1초에 걸쳐 암전
const RECORD=new URLSearchParams(location.search).has('record');
const FADE_START=20000,FADE_DUR=1000;
let fadeStarted=false,motionStart=0;
function fadeAmount(){
  if(!RECORD||phase<1||!motionStart)return 0;
  return Math.min(1,Math.max(0,(performance.now()-motionStart-FADE_START)/FADE_DUR));
}

let cW=0,cH=0;
// phases: 0=intro  1=interactive
let phase=0,phaseT=0;
const mouse={x:-9999,y:-9999,on:false};
let particles=[],baseCanvas=null,typeStart=0;

// ── audio ─────────────────────────────────────────────────────────────────────
let audioCtx=null,droneGain=null,droneOsc=null,droneLfo=null,droneActive=false;
function initAudio(){
  if(audioCtx)return;
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  droneOsc=audioCtx.createOscillator();
  droneOsc.type='sine';droneOsc.frequency.value=52;
  droneLfo=audioCtx.createOscillator();
  droneLfo.type='sine';droneLfo.frequency.value=0.9;
  const lfoGain=audioCtx.createGain();lfoGain.gain.value=18;
  droneLfo.connect(lfoGain);lfoGain.connect(droneOsc.frequency);
  droneGain=audioCtx.createGain();droneGain.gain.value=0;
  const droneFilter=audioCtx.createBiquadFilter();droneFilter.type='lowpass';droneFilter.frequency.value=320;
  droneOsc.connect(droneFilter);droneFilter.connect(droneGain);droneGain.connect(audioCtx.destination);
  droneOsc.start();droneLfo.start();
}
function droneTargetGain(){
  return 0.02+(INFLUENCE_R-38)/(313-38)*0.33;
}
function startDrone(){
  if(!audioCtx||fadeStarted)return;
  const target=droneTargetGain(),now=audioCtx.currentTime;
  droneGain.gain.cancelScheduledValues(now);
  droneGain.gain.setValueAtTime(droneGain.gain.value,now);
  droneGain.gain.linearRampToValueAtTime(target,now+(droneActive?0.06:0.4));
  droneActive=true;
}
function stopDrone(){
  if(!audioCtx||!droneActive)return;
  droneActive=false;
  const now=audioCtx.currentTime;
  droneGain.gain.cancelScheduledValues(now);
  droneGain.gain.setValueAtTime(droneGain.gain.value,now);
  droneGain.gain.linearRampToValueAtTime(0,now+0.18);
}
function fadeOutDrone(ms){
  if(!audioCtx||!droneActive)return;
  droneActive=false;
  const now=audioCtx.currentTime;
  droneGain.gain.cancelScheduledValues(now);
  droneGain.gain.setValueAtTime(droneGain.gain.value,now);
  droneGain.gain.linearRampToValueAtTime(0,now+ms/1000);
}
let mouseMoving=false,_mouseMoveTimer=null;
function onMouseActivity(){
  mouseMoving=true;
  clearTimeout(_mouseMoveTimer);
  _mouseMoveTimer=setTimeout(()=>{mouseMoving=false;stopDrone();},80);
}

// ── canvas ───────────────────────────────────────────────────────────────────
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');

function pBounds(vw,vh){
  const AR=4500/8000;
  if(vw/vh>AR){const dh=vh,dw=Math.floor(dh*AR);return{dx:Math.floor((vw-dw)/2),dy:0,dw,dh};}
  const dw=vw,dh=Math.floor(dw/AR);return{dx:0,dy:Math.floor((vh-dh)/2),dw,dh};
}
function setFull(){
  const pb=pBounds(window.innerWidth,window.innerHeight);
  cW=pb.dw;cH=pb.dh;cv.width=cW;cv.height=cH;
  cv.style.cssText=`display:block;position:fixed;top:${pb.dy}px;left:${pb.dx}px;`;
}
function relayout(){
  setFull();
  if(_loaded===2&&phase===2)buildLayers();
}
window.addEventListener('resize',relayout);

// ── layers & particles ────────────────────────────────────────────────────────
function mixedColor(p){const t=p.mixR;return{r:Math.round(p.r+(255-p.r)*t),g:Math.round(p.g+(255-p.g)*t),b:Math.round(p.b+(255-p.b)*t)};}

function paintComposite(g){
  g.fillStyle='#000';g.fillRect(0,0,cW,cH);
  g.drawImage(imgTypo,0,0,cW,cH);
}
function buildLayers(){
  baseCanvas=document.createElement('canvas');baseCanvas.width=cW;baseCanvas.height=cH;
  paintComposite(baseCanvas.getContext('2d'));
  const sc=document.createElement('canvas');sc.width=cW;sc.height=cH;
  const sctx=sc.getContext('2d',{willReadFrequently:true});
  paintComposite(sctx);
  const d=sctx.getImageData(0,0,cW,cH).data;
  particles=[];
  for(let y=0;y<cH;y+=DOT_SPACING)for(let x=0;x<cW;x+=DOT_SPACING){
    if(Math.random()>PARTICLE_DENSITY)continue;
    const i=(y*cW+x)*4,r=d[i],g=d[i+1],b=d[i+2];
    const lum=.299*r+.587*g+.114*b,maxC=Math.max(r,g,b),sat=maxC?(maxC-Math.min(r,g,b))/maxC:0;
    if(lum<=28&&sat<=.15)continue;
    const s2=(x*1973+y*9301+49297)%233280,sr=s2/233280;
    const size=sr<.60?1+sr*2.5:sr<.85?2.5+(sr-.60)*10:5+(sr-.85)*20;
    particles.push({ox:x,oy:y,x,y,vx:0,vy:0,scatterT:0,r,g,b,size,mixR:.18+Math.random()*.5});
  }
}

function applyParticles(){
  const mx=mouse.x,my=mouse.y,on=mouse.on,R=INFLUENCE_R,R2=R*R,active=[];
  for(const p of particles){
    const dx=mx-p.ox,dy=my-p.oy,d2=dx*dx+dy*dy,inZ=on&&d2<R2;
    if(inZ){const d=Math.sqrt(d2)+.1,f=Math.pow(1-d/R,1.2)*SCATTER_STR;p.vx-=(dx/d)*f;p.vy-=(dy/d)*f;p.vx+=(Math.random()-.5)*NOISE*(f/SCATTER_STR);p.vy+=(Math.random()-.5)*NOISE*(f/SCATTER_STR);p.scatterT+=(Math.pow(1-Math.sqrt(d2)/R,1.2)-p.scatterT)*.10;}
    else{p.vx+=(p.ox-p.x)*SPRING;p.vy+=(p.oy-p.y)*SPRING;p.scatterT+=(0-p.scatterT)*.14;}
    p.vx*=DAMPING;p.vy*=DAMPING;p.x+=p.vx;p.y+=p.vy;
    if(p.scatterT>.012)active.push(p);else{p.x=p.ox;p.y=p.oy;p.vx=0;p.vy=0;}
  }
  if(!active.length)return;
  const cm=new Map();
  for(const p of active){
    const mc=mixedColor(p),k=((mc.r>>5)<<16)|((mc.g>>5)<<8)|(mc.b>>5);
    if(!cm.has(k))cm.set(k,{c:mc,trail:[],flying:[]});
    const grp=cm.get(k);
    grp.trail.push({x:p.ox,y:p.oy,r:p.size*(.7+p.scatterT)+1.5});
    if(!(p.x<-150||p.x>cW+150||p.y<-150||p.y>cH+150))grp.flying.push({x:p.x,y:p.y,r:p.size*(.55+p.scatterT*.55)});
  }
  for(const[,g]of cm){
    ctx.fillStyle=`rgb(${g.c.r},${g.c.g},${g.c.b})`;ctx.beginPath();
    for(const d of g.trail){ctx.moveTo(d.x+d.r,d.y);ctx.arc(d.x,d.y,d.r,0,Math.PI*2);}
    for(const d of g.flying){ctx.moveTo(d.x+d.r,d.y);ctx.arc(d.x,d.y,d.r,0,Math.PI*2);}
    ctx.fill();
  }
}

function drawSpotlight(){
  const rmx=mouse.x,rmy=mouse.y,R=INFLUENCE_R;
  ctx.save();ctx.filter=`blur(${Math.max(10,R*.14)}px)`;
  const gG=ctx.createRadialGradient(rmx,rmy,R*.5,rmx,rmy,R*1.16);
  gG.addColorStop(0,'rgba(255,255,255,0)');gG.addColorStop(.55,'rgba(255,255,255,.40)');gG.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=gG;ctx.beginPath();ctx.arc(rmx,rmy,R*1.16,0,Math.PI*2);ctx.fill();ctx.restore();
  // 경계만 살짝 풀어주는 정도의 약한 블러. 크게 주면 흰색이 번져 회색이 된다
  ctx.save();ctx.filter=`blur(${Math.max(4,R*.05)}px)`;
  const cG=ctx.createRadialGradient(rmx,rmy,0,rmx,rmy,R*1.08);
  cG.addColorStop(0,'rgba(255,255,255,1)');cG.addColorStop(.54,'rgba(255,255,255,1)');
  cG.addColorStop(.64,'rgba(255,255,255,.92)');cG.addColorStop(.73,'rgba(255,255,255,.74)');
  cG.addColorStop(.82,'rgba(255,255,255,.50)');cG.addColorStop(.90,'rgba(255,255,255,.28)');
  cG.addColorStop(.96,'rgba(255,255,255,.11)');cG.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=cG;ctx.beginPath();ctx.arc(rmx,rmy,R*1.08,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function renderInteractive(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,cW,cH);
  ctx.drawImage(baseCanvas,0,0);
  applyParticles();
  if(mouse.on)drawSpotlight();
}

// 가로형과 같은 타자 연출 — 블랙포스터 위로 회색 본문이 한 줄씩 찍힌다
function renderTyping(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,cW,cH);
  ctx.drawImage(imgBlack,0,0,cW,cH);
  const el=performance.now()-typeStart,prog=Math.min(1,el/TYPE_DUR);
  const lp=prog*Math.ceil(cH/LINE_H),curLine=Math.floor(lp),lx=(lp-curLine)*cW,revY=curLine*LINE_H;
  if(revY>0){ctx.save();ctx.beginPath();ctx.rect(0,0,cW,revY);ctx.clip();ctx.drawImage(imgTypo,0,0,cW,cH);ctx.restore();}
  if(lx>0&&revY<cH){ctx.save();ctx.beginPath();ctx.rect(0,revY,lx,LINE_H);ctx.clip();ctx.drawImage(imgTypo,0,0,cW,cH);ctx.restore();}
  if(revY<cH){ctx.fillStyle='rgba(220,220,220,.7)';ctx.fillRect(Math.max(0,lx-1),revY,2,LINE_H);}
  if(prog>=1){buildLayers();phase=2;}
}

function drawPrompt(alpha){
  const cx=cW/2,cy=cH*.83,now=performance.now();
  ctx.save();ctx.globalAlpha=alpha;
  for(let i=0;i<3;i++){const t=((now/2200+i/3)%1);ctx.strokeStyle=`rgba(255,255,255,${(1-t)*.7})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,14+t*54,0,Math.PI*2);ctx.stroke();}
  ctx.fillStyle='rgba(255,255,255,.95)';ctx.beginPath();ctx.arc(cx,cy,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.roundRect(cx-92,cy+42,184,34,5);ctx.fill();
  ctx.font='12px Pretendard,"Pretendard Variable","Helvetica Neue",Helvetica,Arial,sans-serif';
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.textAlign='center';
  ctx.fillText('더블클릭해보세요',cx,cy+63);ctx.restore();
}

// ── main loop ────────────────────────────────────────────────────────────────
let _lastT=0;
function loop(ts){
  const dt=Math.min(ts-_lastT,50);_lastT=ts;
  phaseT+=dt;
  if(phase===0){
    ctx.fillStyle='#000';ctx.fillRect(0,0,cW,cH);
    ctx.drawImage(imgBlack,0,0,cW,cH);
    drawPrompt(Math.min(1,phaseT/1000));
  }else{
    if(phase===1)renderTyping();else renderInteractive();
    const f=fadeAmount();
    if(f>0){
      if(!fadeStarted){fadeStarted=true;fadeOutDrone(FADE_DUR);}
      ctx.fillStyle=`rgba(0,0,0,${f})`;ctx.fillRect(0,0,cW,cH);
    }
  }
  requestAnimationFrame(loop);
}

// ── images ───────────────────────────────────────────────────────────────────
const imgBlack=new Image(),imgTypo=new Image();
let _loaded=0;
function onLoad(){_loaded++;if(_loaded===2){setFull();requestAnimationFrame(loop);}}
[imgBlack,imgTypo].forEach(i=>i.onload=onLoad);
imgBlack.src=SRC_BLACK;imgTypo.src=SRC_TYPO;

// ── events ───────────────────────────────────────────────────────────────────
cv.addEventListener('mousemove',e=>{
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  const r=cv.getBoundingClientRect();
  mouse.x=(e.clientX-r.left)*(cW/r.width);
  mouse.y=(e.clientY-r.top)*(cH/r.height);
  mouse.on=true;
  if(phase===2)onMouseActivity();
});
cv.addEventListener('mouseenter',()=>mouse.on=true);
cv.addEventListener('mouseleave',()=>{mouse.on=false;stopDrone();});

window.addEventListener('wheel',e=>{
  if(phase!==2)return;
  e.preventDefault();
  INFLUENCE_R=Math.max(38,Math.min(313,INFLUENCE_R+(e.deltaY>0?-8:8)));
  if(droneActive)startDrone();
},{passive:false});

window.addEventListener('dblclick',()=>{
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  if(phase===0){initAudio();phase=1;phaseT=0;typeStart=performance.now();motionStart=typeStart;}
  else{phase=0;phaseT=0;stopDrone();particles=[];INFLUENCE_R=113;fadeStarted=false;motionStart=0;}
});
</script>
